name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Generate project
        run: bash ffpanel.sh
      - name: Build APK (Debug)
        run: |
          cd FFPanel
          gradle assembleDebug --stacktrace
      - name: Rename APK to Release
        run: |
          mv FFPanel/app/build/outputs/apk/debug/app-debug.apk FFPanel/app/build/outputs/apk/debug/app-release.apk
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FF Panel v1.0.${{ github.run_number }}
          files: FFPanel/app/build/outputs/apk/debug/app-release.apk
          make_latest: true
