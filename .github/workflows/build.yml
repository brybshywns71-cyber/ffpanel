name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true
      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - name: Generate project
        run: |
          sed -i 's/version "8.1.0"/version "8.2.2"/g' ffpanel.sh
          sed -i 's/gradle-version 8.1/gradle-version 8.2/g' ffpanel.sh
          bash ffpanel.sh
      - name: Build APK
        run: |
          cd FFPanel
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FF Panel v1.0.${{ github.run_number }}
          files: FFPanel/app/build/outputs/apk/release/*.apk
          make_latest: true
