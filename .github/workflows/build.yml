name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Generate project and Patch Gradle
        run: |
          # تعديل نسخ البرامج في السكربت الأساسي
          sed -i 's/version "8.1.0"/version "8.2.2"/g' ffpanel.sh
          sed -i 's/version "1.9.0"/version "1.9.22"/g' ffpanel.sh
          bash ffpanel.sh
          
          # استبدال ملف الـ Gradle الخاص بالتطبيق لضبط نسخ الـ Java
          cat << 'EOF' > FFPanel/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.vanta.ffpanel"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.vanta.ffpanel"
                  minSdk = 26; targetSdk = 34
                  versionCode = 1; versionName = "1.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              androidResources { noCompress += "tflite" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("org.tensorflow:tensorflow-lite:2.14.0")
          }
          EOF
      - name: Build APK
        run: |
          cd FFPanel
          gradle assembleRelease --stacktrace
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FF Panel v1.0.${{ github.run_number }}
          files: FFPanel/app/build/outputs/apk/release/*.apk
          make_latest: true
